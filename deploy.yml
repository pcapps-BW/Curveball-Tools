---
- name: Deploy Local Web Server and Tool Suite
  hosts: all
  become: yes
  tasks:
    - name: Install required packages
      package:
        name:
          - nginx
          - python3-pip
          - git
        state: present

    - name: Clone or sync application source code
      git:
        repo: 'https://github.com/pcapps-BW/Curveball-Tools.git'
        dest: /usr/local/scripts/NOEIP/Curveball
        version: main

    - name: Ensure web server service is running
      service:
        name: nginx
        state: started
        enabled: yes