---
- name: Deploy Local Web Server and Tool Suite
  hosts: all
  become: yes
  tasks:
    - name: Install required packages
      package:
        name:
          - nginx
          - python3-pip
          - git
        state: present

    - name: Clone or sync application source code
      git:
        repo: 'git@github.com:pcapps-BW/Curveball-Tools.git'
        dest: /usr/local/scripts/NOEIP/Curveball
        version: main
        force: yes

    - name: Install Python dependencies
      pip:
        requirements: /usr/local/scripts/NOEIP/Curveball/requirements.txt

    - name: Allow Nginx to connect to network proxies (SELinux)
      seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Create Systemd service for Flask App
      copy:
        dest: /etc/systemd/system/curveball.service
        content: |
          [Unit]
          Description=Curveball Tools Web Application
          After=network.target

          [Service]
          User=pcapps
          WorkingDirectory=/usr/local/scripts/NOEIP/Curveball
          ExecStart=/usr/bin/python3 /usr/local/scripts/NOEIP/Curveball/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Configure Nginx reverse proxy
      copy:
        dest: /etc/nginx/conf.d/curveball.conf
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://localhost:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }

    - name: Disable default welcome page
      file:
        path: /etc/nginx/default.d/welcome.conf
        state: absent

    - name: Ensure Flask app service is running
      systemd:
        name: curveball.service
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Ensure Nginx is running and reloaded
      service:
        name: nginx
        state: reloaded
        enabled: yes